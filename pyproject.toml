[project]
name = "swiss-grounding-mcp"
version = "0.1.0"
description = "MCP server grounding AI assistants in authoritative Swiss public sources (jurisdiction-first)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
build = ["openpyxl>=3.1"]

[project.scripts]
swiss-grounding-mcp = "swiss_grounding.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swiss_grounding"]
