# Places outside Switzerland that users often confuse or mention (lowercase, any language).
foreign_places:
  countries: [deutschland, germany, allemagne, germania, frankreich, france, francia, italien, italy, italie, italia,
              österreich, austria, autriche, liechtenstein]
  places: [konstanz, constance, costanza, münchen, munich, stuttgart, berlin, hamburg, frankfurt, lörrach,
           weil am rhein, singen, friedrichshafen, lindau, waldshut, bregenz, feldkirch, dornbirn, vaduz, wien,
           vienne, vienna, innsbruck, mailand, milano, milan, como, varese, torino, turin, roma, rome, paris,
           lyon, annecy, annemasse, mulhouse, strasbourg, besançon, évian, thonon, london, new york]

# Topics: keywords are matched against the normalised question (lowercase, no accents, word-prefix match).
# level = who decides the matter; needs_place = answer depends on where the person lives.
topics:
  health_premiums:
    level: federal
    needs_place: true
    tool: health_insurance_premiums
    keywords: [krankenkass, krankenversicherung, grundversicherung, pramie, franchise, assurance maladie, assurance de base,
               lamal, kvg, cassa malati, assicurazione malattia, assicurazione di base, premio, franchigia, cassa da malsauns,
               health insurance, premium, deductible]
    sources: [https://www.priminfo.admin.ch/]
  school_holidays:
    level: municipal
    needs_place: true
    tool: school_holidays
    keywords: [schulferien, herbstferien, sommerferien, winterferien, fruhlingsferien, sportferien, vacances scolaires,
               vacances d, vacanze scolastiche, vacanze, vacanzas, school holiday, schulbeginn, rentree scolaire]
  waste:
    level: municipal
    needs_place: true
    tool: waste_collection
    keywords: [karton, altpapier, papiersammlung, kehricht, abfall, entsorg, grungut, bioabfall, sonderabfall, carton,
               dechet, ordure, poubelle, cartone, rifiuti, raccolta carta, spazzatura, cartun, ruments, waste, cardboard,
               garbage, recycling, sperrgut, sofa, encombrant]
  public_transport:
    level: federal
    needs_place: false
    tool: public_transport_connections
    keywords: [verbindung, fahrplan, nachste zug, nachster zug, zug nach, bus nach, connexion, horaire, prochain train,
               treno, collegamento, orario, prossimo treno, tren, connection, next train, timetable]
  federal_votes:
    level: federal
    needs_place: false
    tool: federal_votes
    keywords: [abstimmung, volksabstimmung, abgestimmt, abstimmen, stimmen wir, votation, vote, votons, votiamo, votazione, votaziun, referendum, ballot, initiative populaire,
               volksinitiative, iniziativa popolare]
    sources: [https://www.bk.admin.ch/de/volksabstimmungen]
  companies:
    level: federal
    needs_place: false
    tool: company_register_search
    keywords: [handelsregister, zefix, registre du commerce, registro di commercio, commercial register, eingetragen, uid-nummer]
    sources: [https://www.zefix.ch/]
  driving_licence:
    level: cantonal
    canton_office: road_traffic  # route to cantons.<X>.offices.road_traffic
    needs_place: false  # the core rules (12-month exchange deadline, eye test) are federal; offices are cantonal
    keywords: [fuhrerausweis, fahrausweis, fuhrerschein, permis de conduire, licenza di condurre, patente di guida, patente,
               permiss da manischar, driving licence, driving license, drivers license]
    sources: [https://asa.ch/strassenverkehrsaemter/adressen/]
    # official wording used by ch.ch per language (added to the search when this topic is detected)
    search_terms: {de: Führerausweis umtauschen, fr: permis de conduire échange, it: licenza di condurre estera,
                   rm: permiss da manischar, en: driving licence exchange}
  residence_registration:
    level: municipal
    needs_place: true
    keywords: [anmelden, anmeldung, abmelden, melde ich mich, mich anmelden, ummelden, einwohnerkontrolle, einwohnerdienste, zuzug, umzug, demenag, annoncer mon arrivee,
               controle des habitants, trasloco, notifica arrivo, controllo abitanti, moving, register my address]
  migration_permits:
    level: federal
    needs_place: false
    keywords: [aufenthaltsbewilligung, arbeitsbewilligung, ausweis b, ausweis c, ausweis l, permis de sejour, permis b, permis c,
               permis de travail, permesso di dimora, permesso di lavoro, work permit, residence permit, visum, visa]
    sources: [https://www.sem.admin.ch/sem/de/home/themen/aufenthalt.html]
  ahv_pension:
    level: federal
    needs_place: false
    keywords: [ahv, altersrente, rente, pensionskasse, avs, rente de vieillesse, rendita, pension, pensiun, old-age]
    sources: [https://www.ahv-iv.ch/de/]
  unemployment:
