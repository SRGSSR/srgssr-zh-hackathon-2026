# Source registry: which Swiss sources the server trusts, and at which level.
# Edit this file to extend coverage; the server reloads it on restart. All URLs verified 2026-09-24.
#
# levels: federal | cantonal | municipal | semi-official (legal mandate) ; anything else is "unverified".

federal:
  domains: [admin.ch, ch.ch, parlament.ch, bger.ch]

semi_official:
  ahv-iv.ch: AHV/IV information centre (compensation offices)
  arbeit.swiss: SECO unemployment insurance portal
  serafe.ch: SERAFE AG, federal mandate for radio/TV fee collection
  asa.ch: Association of road traffic offices (asa)
  opentransportdata.swiss: Open data platform mobility (FOT mandate)
  zefix.ch: Federal Office of Justice (commercial register index)
  sbb.ch: Swiss Federal Railways
  edk.ch: Swiss Conference of Cantonal Ministers of Education
  educa.ch: Swiss education server (Confederation/cantons)
  kvg.org: Common Institution KVG

